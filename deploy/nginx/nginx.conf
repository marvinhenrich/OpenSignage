worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  client_max_body_size 2g;            # große Medien-Uploads (Videos)
  server_tokens off;

  upstream cms { server cms:3000; }

  # HTTP -> HTTPS
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # CMS-API
    location /api/ {
      proxy_pass http://cms;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live-Push WebSocket für Player
    location /ws/ {
      proxy_pass http://cms;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # Dauerverbindung: NICHT nach 1 h kappen. proxy_read_timeout zaehlt nur Daten
      # vom CMS zum Player - der Player-Heartbeat (Gegenrichtung) haelt sie NICHT offen.
      # Mit 3600s riss jede Player-Sitzung exakt nach 60 min ab. Der CMS-seitige
      # WS-Ping (alle 30 s) haelt sie jetzt aktiv; der lange Timeout ist die Absicherung.
      proxy_read_timeout 7d;
      proxy_send_timeout 7d;
    }

    # Statisch ausgelieferte Medien (mit Cache) direkt aus dem Volume
    location /media/ {
      alias /data/media/;
      # Browser NICHT den Inhaltstyp erraten lassen: eine als Bild hochgeladene Datei
      # darf nicht als HTML/Skript in der CMS-Domain ausgefuehrt werden.
      add_header X-Content-Type-Options "nosniff" always;
      # Riegel gegen aktive Inhalte: 'default-src none' verbietet auch Skripte INNERHALB
      # einer SVG-Datei, wenn sie direkt aufgerufen wird. Bewusst OHNE 'sandbox' - das
      # wuerde die PDF-Anzeige im Rahmen zerschiessen.
      add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; font-src 'self'" always;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Admin-SPA (React) — Client-seitiges Routing via try_files
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
